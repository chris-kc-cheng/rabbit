name: rabbit
services:
  api:
    image: ${RABBIT_API_IMAGE:?Set RABBIT_API_IMAGE}
    environment:
      RABBIT_ENV: production
      RABBIT_ADMIN_PASSWORD: ${RABBIT_ADMIN_PASSWORD:?Set RABBIT_ADMIN_PASSWORD}
      RABBIT_JWT_SECRET: ${RABBIT_JWT_SECRET:?Set RABBIT_JWT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rabbit_internal]
  web:
    image: ${RABBIT_WEB_IMAGE:?Set RABBIT_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RABBIT_PORT:-8090}:8080"
    security_opt: ["no-new-privileges:true"]
    networks: [rabbit_internal]
networks:
  rabbit_internal:
    name: rabbit-internal
