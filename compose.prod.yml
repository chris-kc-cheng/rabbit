name: rabbit
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: ${RABBIT_DATABASE_PASSWORD:?Set RABBIT_DATABASE_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbit_postgres:/var/lib/postgresql/data
    networks: [rabbit_internal]
  api:
    image: ${RABBIT_API_IMAGE:?Set RABBIT_API_IMAGE}
    environment:
      RABBIT_ENV: production
      RABBIT_ADMIN_PASSWORD: ${RABBIT_ADMIN_PASSWORD:?Set RABBIT_ADMIN_PASSWORD}
      RABBIT_JWT_SECRET: ${RABBIT_JWT_SECRET:?Set RABBIT_JWT_SECRET}
      RABBIT_DATABASE_HOST: db
      RABBIT_DATABASE_NAME: rabbit
      RABBIT_DATABASE_USER: rabbit
      RABBIT_DATABASE_PASSWORD: ${RABBIT_DATABASE_PASSWORD:?Set RABBIT_DATABASE_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RABBIT_EMAIL_FROM: ${RABBIT_EMAIL_FROM:?Set RABBIT_EMAIL_FROM}
      RABBIT_PUBLIC_URL: ${RABBIT_PUBLIC_URL:?Set RABBIT_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rabbit_internal]
  web:
    image: ${RABBIT_WEB_IMAGE:?Set RABBIT_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks:
      rabbit_internal:
      proxy:
        aliases: [rabbit-web]
networks:
  rabbit_internal:
    name: rabbit-internal
  proxy:
    external: true
    name: proxy
volumes:
  rabbit_postgres:
