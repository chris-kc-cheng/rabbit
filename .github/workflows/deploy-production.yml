name: Test and deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: rabbit-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: Set image names
        id: images
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=$base/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web=$base/web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: true, tags: "${{ steps.images.outputs.api }}", cache-from: "type=gha,scope=api", cache-to: "type=gha,mode=max,scope=api" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: frontend/Dockerfile, push: true, tags: "${{ steps.images.outputs.web }}", cache-from: "type=gha,scope=web", cache-to: "type=gha,mode=max,scope=web" }
      - name: Configure SSH
        env: { SSH_KEY: "${{ secrets.HOSTINGER_SSH_KEY }}", KNOWN_HOSTS: "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" }
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger && chmod 600 ~/.ssh/hostinger
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Deploy isolated Compose project
        env:
          HOST: "${{ secrets.HOSTINGER_HOST }}"
          PORT: "${{ secrets.HOSTINGER_SSH_PORT }}"
          USER: "${{ secrets.HOSTINGER_USER }}"
          GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          API_IMAGE: "${{ steps.images.outputs.api }}"
          WEB_IMAGE: "${{ steps.images.outputs.web }}"
          RABBIT_PORT: "${{ vars.RABBIT_PORT || '8090' }}"
        run: |
          ssh -i ~/.ssh/hostinger -p "$PORT" "$USER@$HOST" 'mkdir -p ~/rabbit'
          scp -i ~/.ssh/hostinger -P "$PORT" compose.prod.yml "$USER@$HOST:~/rabbit/compose.prod.yml"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/hostinger -p "$PORT" "$USER@$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          printf 'RABBIT_API_IMAGE=%s\nRABBIT_WEB_IMAGE=%s\nRABBIT_PORT=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$RABBIT_PORT" | ssh -i ~/.ssh/hostinger -p "$PORT" "$USER@$HOST" 'umask 077; cat > ~/rabbit/.env.prod'
          ssh -i ~/.ssh/hostinger -p "$PORT" "$USER@$HOST" 'cd ~/rabbit && docker compose -p rabbit --env-file .env.prod -f compose.prod.yml pull && docker compose -p rabbit --env-file .env.prod -f compose.prod.yml up -d --remove-orphans'
