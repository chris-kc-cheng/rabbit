name: rabbit
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d rabbit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbit_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${RABBIT_DATABASE_PORT:-5432}:5432"
    networks: [rabbit_internal]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      RABBIT_ADMIN_PASSWORD: ${RABBIT_ADMIN_PASSWORD:?Set RABBIT_ADMIN_PASSWORD}
      RABBIT_DATABASE_HOST: db
      RABBIT_DATABASE_NAME: rabbit
      RABBIT_DATABASE_USER: rabbit
      RABBIT_DATABASE_PASSWORD: rabbit-local
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RABBIT_EMAIL_FROM: ${RABBIT_EMAIL_FROM:-Rabbit <onboarding@resend.dev>}
      RABBIT_PUBLIC_URL: ${RABBIT_PUBLIC_URL:-http://localhost:8090}
      WATCHFILES_FORCE_POLLING: "true"
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --reload --reload-dir app"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./content:/app/content:ro
      - ./frontend/public:/app/frontend/public:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rabbit_internal]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - rabbit_frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${RABBIT_PORT:-8090}:5173"
    security_opt: ["no-new-privileges:true"]
    networks: [rabbit_internal]
networks:
  rabbit_internal:
    name: rabbit-internal
volumes:
  rabbit_postgres:
  rabbit_frontend_node_modules:
